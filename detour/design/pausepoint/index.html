<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pausepoint proof</title>
  <style>
    body { margin: 1.25rem auto; padding: 0 .75rem; max-width: 46rem; background: #151717; color: #f1f2eb; font: 1rem/1.45 system-ui, sans-serif; }
    h1 { margin: 0; }
    form { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem; margin: 1rem 0; }
    input, button { min-height: 44px; font: inherit; }
    input { box-sizing: border-box; width: 6rem; }
    form :focus-visible { outline: 3px solid #e4ff52; outline-offset: 3px; }
    .pausepoint-mark { position: absolute; inset-block-start: calc(50% - 15px); height: 9px; width: 10px; background: #e4ff52; transform: translateX(-50%); clip-path: polygon(0 0, 100% 0, 50% 100%); pointer-events: none; }
  </style>
</head>
<body>
  <h1>Pausepoint</h1>
  <p>Choose a future time to pause once as you watch.</p>
  <div id="player"></div>
  <form id="picker">
    <label for="target">Pause at (seconds)</label>
    <input id="target" type="number" min="0" step="0.1" value="20" required>
    <button type="submit">Arm pause</button>
    <button type="button" id="cancel" disabled>Clear</button>
  </form>
  <p id="summary" role="status">Choose a time ahead of the playhead.</p>
  <script type="module" src="./proof.js"></script>
</body>
</html>
