<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#151717">
  <title>DETOUR — Keep your place</title>
</head>
<body>
  <main class="demo">
    <header class="demo-heading">
      <h1>DETOUR<span>.</span></h1>
      <p>Keep your place. Explore another moment. Return in one action.</p>
    </header>
    <section class="mux-panel" aria-label="Playback recovery" hidden>
      <p class="mux-status" data-detour-source-status aria-live="polite"></p>
      <div class="mux-actions">
        <button type="button" data-detour-retry hidden>Try video again</button>
        <button type="button" data-detour-fallback>Use backup video</button>
      </div>
    </section>
    <div id="example"></div>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
