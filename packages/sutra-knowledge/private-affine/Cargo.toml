[package]
name = "sutra-private-affine"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
bp = { package = "bulletproofs", version = "=5.0.0" }
curve25519-dalek = { version = "=4.1.3", features = ["rand_core"] }
merlin = "=3.0.0"
rand_core = { version = "=0.6.4", features = ["getrandom"] }
getrandom = { version = "=0.2.17", features = ["custom"] }
zeroize = "=1.9.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
clear_on_drop = { version = "=0.2.5", features = ["no_cc"] }

[profile.release]
opt-level = 3
lto = true
panic = "abort"
strip = "symbols"
