name: Validate SUTRA operator model approval browser
on:
  push:
    branches: ['main']
    paths: ['apps/sutra-v2/**','packages/sutra-knowledge/**','packages/sutra-inference/**','packages/sutra-consent/**','.github/workflows/sutra-v2-operator-browser.yml']
  pull_request:
    branches: ['main']
    paths: ['apps/sutra-v2/**','packages/sutra-knowledge/**','packages/sutra-inference/**','packages/sutra-consent/**','.github/workflows/sutra-v2-operator-browser.yml']
permissions:
  contents: read
jobs:
  operator-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact candidate revision
        env:
          EXPECTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/sutra-v2/package-lock.json
      - run: node --check apps/sutra-v2/test/model-approval-browser.cjs
      - run: npm ci --prefix apps/sutra-v2
      - name: Build canonical browser artifact
        run: |
          rustup target add wasm32-unknown-unknown
          node apps/sutra-v2/build.mjs
          node --test apps/sutra-v2/test/build-contract.test.mjs
      - run: node packages/sutra-runtime/verify-vendor.mjs
      - run: node apps/sutra-v2/node_modules/playwright/cli.js install --with-deps chromium
      - name: Execute operator approval and credential lifecycle
        run: node apps/sutra-v2/test/model-approval-browser.cjs
