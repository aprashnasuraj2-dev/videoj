name: Validate SUTRA Open Kit candidate
on:
  pull_request:
    paths:
      - 'tools/sutra-open-kit/**'
      - 'tools/sutra-starter/**'
      - 'packages/sutra-*/**'
      - 'docs/sutra/CONTRIBUTING.md'
      - 'docs/sutra/CHANGELOG.md'
      - '.github/workflows/sutra-open-kit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify candidate, deterministic rebuild and tamper/secret rejection
        run: node --test tools/sutra-open-kit/test.mjs
      - name: Clean source-distribution checks
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/sutra-open-kit"
          node tools/sutra-open-kit/build.mjs build "$target"
          node tools/sutra-open-kit/build.mjs verify "$target"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -cf "$RUNNER_TEMP/sutra-open-kit-development.tar" -C "$target" .
          mkdir "$RUNNER_TEMP/sutra-open-kit-roundtrip"
          tar -xf "$RUNNER_TEMP/sutra-open-kit-development.tar" -C "$RUNNER_TEMP/sutra-open-kit-roundtrip"
          node tools/sutra-open-kit/build.mjs verify "$RUNNER_TEMP/sutra-open-kit-roundtrip"
          rm "$RUNNER_TEMP/sutra-open-kit-development.tar"
          cd "$target/evidence-validator"
          node cli.mjs examples/receipt.json examples/sources.json
          cd "$target/consent-inspector"
          node --input-type=module -e "import {createConsentInspector} from './index.js'; const i=createConsentInspector({decide:async()=>({decision:'deny',scope:'once'})}); let called=0; try {await i.perform({origin:'https://peer.example',kind:'peer_manifest',purpose:'Load example manifest',disclosure:['network name']},()=>{called++})} catch(e) {if(e.code!=='CONSENT_DENIED')throw e;} if(called)throw Error('Denied contact executed');"
          cd "$target/publisher-starter"
          npm install --ignore-scripts --offline --no-audit --no-fund
          npm run verify:vendor
          npm test
