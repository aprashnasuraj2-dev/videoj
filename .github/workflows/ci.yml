name: Validate submission candidate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install media tools for reproducible original-film encodes
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm run typecheck
      - name: Build and require a decoded compatibility rendition
        run: DHAGO_REQUIRE_WEBM=1 npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-evidence
          path: |
            test-results/
            playwright-report/
            dist/
          retention-days: 14

  public-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify production Mux playback and live Studio Journal
        env:
          DHAGO_LIVE_URL: https://creative.aafnaipatro.com
        run: npx playwright test tests/live.spec.ts --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-smoke-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 14
