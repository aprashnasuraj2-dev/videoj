name: Validate DHAGO

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'apps/preview/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'apps/preview/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install FFmpeg for media reproducibility
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Verify canonical film and prepare metadata
        run: |
          npm run sync:canonical-media
          DHAGO_REQUIRE_WEBM=1 npm run prepare:weave
      - name: Typecheck and build
        run: |
          npm run typecheck
          DHAGO_REQUIRE_WEBM=1 npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify player interactions
        run: npm test
      - name: Reuse source-matched build across browser checks and optional releases
        uses: actions/upload-artifact@v4
        with:
          name: dhago-build
          path: dist/
          retention-days: 4
          if-no-files-found: error
      - name: Keep regression diagnostics only on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dhago-failure-diagnostics
          path: |
            test-results/
            playwright-report/
          retention-days: 3
          if-no-files-found: ignore

  cross-browser:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dhago-build
          path: dist/
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Exercise player in ${{ matrix.browser }}
        env:
          DHAGO_BROWSER: ${{ matrix.browser }}
        run: npx playwright test tests/browser-proof.spec.ts --workers=1
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dhago-${{ matrix.browser }}-failure
          path: |
            test-results/
            playwright-report/
          retention-days: 3
          if-no-files-found: ignore

  mux-playback:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 12
    continue-on-error: true
    env:
      DHAGO_MUX_PLAYBACK_PROBE: '1'
      PLAYWRIGHT_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dhago-build
          path: dist/
      - run: npx playwright install --with-deps chromium
      - name: Verify optional Mux HLS playback
        run: npx playwright test tests/mux.spec.ts --workers=1
