name: Validate submission candidate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install media tools for reproducible original-film encodes
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Generate actual video weave metadata for typecheck
        run: DHAGO_REQUIRE_WEBM=1 npm run prepare:weave
      - run: npm run typecheck
      - name: Build and require a decoded compatibility rendition
        run: DHAGO_REQUIRE_WEBM=1 npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-evidence
          path: |
            test-results/
            playwright-report/
            dist/
          retention-days: 14

  browser-proof:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: candidate-evidence
      - name: Install ${{ matrix.browser }} only
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run compact judge-visible browser proof
        env:
          DHAGO_BROWSER: ${{ matrix.browser }}
        run: npx playwright test tests/browser-proof.spec.ts --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-proof-${{ matrix.browser }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14

  stage-dist:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, browser-proof]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: candidate-evidence
      - name: Stage the exact dist exercised by verify
        run: node scripts/stage-cf-dist.mjs

  public-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: stage-dist
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      # GitHub-hosted Ubuntu includes branded Chrome with H.264/AAC support.
      # Playwright's downloaded Chromium may intentionally omit proprietary codecs,
      # which exercises DHAGO's WebM fallback rather than the Mux path.
      PLAYWRIGHT_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: candidate-evidence
      - run: npx playwright install --with-deps chromium
      - name: Bind smoke to the published immutable release
        env:
          DHAGO_LIVE_URL: https://creative.aafnaipatro.com/
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          import { setTimeout as sleep } from 'node:timers/promises';
          const origin = new URL(process.env.DHAGO_LIVE_URL);
          const manifestUrl = new URL('release-manifest.json', origin);
          for (let attempt = 0; attempt < 70; attempt++) {
            try {
              manifestUrl.searchParams.set('check', String(Date.now()));
              const response = await fetch(manifestUrl, { signal: AbortSignal.timeout(5000) });
              const manifest = response.ok ? await response.json() : null;
              if (manifest?.source_sha === process.env.GITHUB_SHA) {
                const entry = manifest.files.find(({ key }) => /^assets\/demo-[\w-]+\.js$/.test(key));
                if (!entry) throw new Error('Published manifest lacks the demo entry');
                appendFileSync(process.env.GITHUB_ENV, `DHAGO_EXPECTED_ENTRY_ASSET=${entry.key}\n`);
                process.exit(0);
              }
            } catch (error) {
              if (attempt === 69) console.error(error.message);
            }
            await sleep(10000);
          }
          throw new Error('Dedicated public origin did not serve this exact release manifest.');
          JS
      - name: Verify production canonical playback and live Studio Journal
        env:
          DHAGO_LIVE_URL: https://creative.aafnaipatro.com
        run: npx playwright test tests/live.spec.ts --workers=1
      - name: Capture actual public browser interaction and screenshots
        env:
          DHAGO_LIVE_URL: https://creative.aafnaipatro.com/
          DHAGO_RELEASE_SHA: ${{ github.sha }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          node scripts/capture-submission.mjs test-results/submission
      - name: Measure Lighthouse mobile and release size
        env:
          DHAGO_LIVE_URL: https://creative.aafnaipatro.com/
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          mkdir -p test-results/submission
          npx --yes lighthouse@13.6.0 "$DHAGO_LIVE_URL" \
            --output=json \
            --output-path=test-results/submission/lighthouse-mobile.json \
            --only-categories=performance \
            --only-categories=accessibility \
            --only-categories=best-practices \
            --only-categories=seo \
            --form-factor=mobile \
            --chrome-flags="--headless --no-sandbox --disable-gpu" \
            --quiet
          cp dist/dhago-size.json test-results/submission/dhago-size.json
          node scripts/summarize-performance.mjs \
            test-results/submission/lighthouse-mobile.json \
            dist/dhago-size.json \
            test-results/submission/performance-evidence
      - name: Assemble judge-facing evidence index
        run: node scripts/write-final-evidence.mjs test-results/submission
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-smoke-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 14
