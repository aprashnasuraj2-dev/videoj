name: Validate SUTRA v2 knowledge kernel
on:
  push:
    branches: ['sutra/v2-knowledge-compiler']
    paths: ['apps/sutra-v2/**', 'packages/sutra-knowledge/**', 'packages/sutra-runtime/**', 'packages/sutra-evidence/**', 'packages/sutra-consent/**', 'packages/sutra-consent/strict-json.js', '.github/workflows/sutra-v2-knowledge.yml', 'docs/sutra-v2/**']
  pull_request:
    branches: ['main', 'sutra/caller-peer-failure-boundary']
    paths: ['apps/sutra-v2/**', 'packages/sutra-knowledge/**', 'packages/sutra-runtime/**', 'packages/sutra-evidence/**', 'packages/sutra-consent/**', 'packages/sutra-consent/strict-json.js', '.github/workflows/sutra-v2-knowledge.yml', 'docs/sutra-v2/**']
permissions:
  contents: read
jobs:
  knowledge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test packages/sutra-knowledge/test/*.test.mjs
      - name: Execute and assert capability demonstration
        run: |
          node packages/sutra-knowledge/examples/observatory.mjs > sutra-v2-observation.json
          cat sutra-v2-observation.json
      - name: Execute finite-world observation planning challenge
        run: |
          node --input-type=module -e "import {demonstrateFrontier} from './packages/sutra-knowledge/examples/frontier.mjs'; console.log(JSON.stringify(await demonstrateFrontier(),null,2));" > sutra-v2-frontier.json
          cat sutra-v2-frontier.json
      - name: Independent Python reference replay
        run: |
          node packages/sutra-knowledge/examples/export-challenges.mjs > sutra-v2-challenges.json
          python3 packages/sutra-knowledge/reference/verify.py sutra-v2-challenges.json > sutra-v2-reference.json
          cat sutra-v2-reference.json
      - uses: actions/upload-artifact@v4
        with:
          name: sutra-v2-observation
          path: |
            sutra-v2-observation.json
            sutra-v2-frontier.json
            sutra-v2-challenges.json
            sutra-v2-reference.json
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/sutra/package-lock.json
      - run: npm ci --prefix apps/sutra
      - run: node apps/sutra/node_modules/vite/bin/vite.js build apps/sutra-v2
      - run: node packages/sutra-runtime/verify-vendor.mjs
      - run: node apps/sutra/node_modules/playwright/cli.js install --with-deps chromium
      - run: node apps/sutra-v2/test/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sutra-v2-browser-observation
          path: apps/sutra-v2/test-output/
          if-no-files-found: ignore
