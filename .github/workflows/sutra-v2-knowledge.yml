name: Validate SUTRA v2 knowledge kernel
on:
  push:
    branches: ['sutra/v2-knowledge-compiler']
    paths: ['apps/sutra-v2/**', 'packages/sutra-knowledge/**', 'packages/sutra-runtime/**', 'packages/sutra-inference/**', 'services/sutra-api/**', 'packages/sutra-evidence/**', 'packages/sutra-content-profile/**', 'packages/sutra-source-tools/**', 'apps/sutra/public/content/**', 'apps/sutra/public/transcripts/**', 'apps/sutra/public/media/timing-fixture.mp4', 'apps/sutra/src/seek-policy.js', 'packages/sutra-consent/**', 'packages/sutra-consent/strict-json.js', '.github/workflows/sutra-v2-knowledge.yml', 'docs/sutra-v2/**']
  pull_request:
    branches: ['main', 'sutra/caller-peer-failure-boundary']
    paths: ['apps/sutra-v2/**', 'packages/sutra-knowledge/**', 'packages/sutra-runtime/**', 'packages/sutra-inference/**', 'services/sutra-api/**', 'packages/sutra-evidence/**', 'packages/sutra-content-profile/**', 'packages/sutra-source-tools/**', 'apps/sutra/public/content/**', 'apps/sutra/public/transcripts/**', 'apps/sutra/public/media/timing-fixture.mp4', 'apps/sutra/src/seek-policy.js', 'packages/sutra-consent/**', 'packages/sutra-consent/strict-json.js', '.github/workflows/sutra-v2-knowledge.yml', 'docs/sutra-v2/**']
permissions:
  contents: read
jobs:
  knowledge:
    runs-on: ubuntu-latest
    # V2-013: the preserved formal suite grew beyond the historical five-minute
    # budget once client-policy ancestry and admission models were added. Keep
    # every safe/unsafe gate; provide bounded execution headroom instead of
    # deleting models or weakening assertions to manufacture green CI.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate executable SUTRA v2 threat model coverage
        run: node docs/sutra/tools/threat-model-check.mjs
      - name: Run bounded inference and opaque credential boundary tests
        run: node --test packages/sutra-inference/test/*.test.mjs
      - name: Execute threat-register runtime and API regressions
        run: |
          node --test packages/sutra-runtime/test/private-context.test.mjs packages/sutra-runtime/test/peer-boundary.test.mjs packages/sutra-runtime/test/peer-invocation.test.mjs
          node --test services/sutra-api/test/inference.test.mjs
      - name: Go offline checkpoint contract and adversarial tests
        run: |
          go version
          go test -count=1 -v packages/sutra-knowledge/checkpoint/main.go packages/sutra-knowledge/checkpoint/support_replay.go packages/sutra-knowledge/checkpoint/main_test.go
      - name: Go scoped action protocol real TCP and race tests
        run: |
          mkdir -p "$GITHUB_WORKSPACE/sutra-v2-bridge-traces"
          SUTRA_BRIDGE_TRACE_DIR="$GITHUB_WORKSPACE/sutra-v2-bridge-traces" SUTRA_AUTHORITY_TRACE="$GITHUB_WORKSPACE/sutra-v2-authority-trace.json" SUTRA_UPSTREAM_TRACE="$GITHUB_WORKSPACE/sutra-v2-upstream-trace.json" SUTRA_UPSTREAM_WITNESS_TRACE="$GITHUB_WORKSPACE/sutra-v2-upstream-witness-trace.json" SUTRA_PINNED_POLICY_TRACE="$GITHUB_WORKSPACE/sutra-v2-pinned-policy-trace.json" go test -race -count=1 -v packages/sutra-knowledge/action-protocol/protocol.go packages/sutra-knowledge/action-protocol/transport.go packages/sutra-knowledge/action-protocol/protocol_test.go packages/sutra-knowledge/action-protocol/durable_linux.go packages/sutra-knowledge/action-protocol/durable_linux_test.go packages/sutra-knowledge/action-protocol/anchor_linux.go packages/sutra-knowledge/action-protocol/anchor_linux_test.go packages/sutra-knowledge/action-protocol/caller_linux.go packages/sutra-knowledge/action-protocol/caller_linux_test.go packages/sutra-knowledge/action-protocol/authority_linux.go packages/sutra-knowledge/action-protocol/authority_linux_test.go packages/sutra-knowledge/action-protocol/witness_linux.go packages/sutra-knowledge/action-protocol/witness_linux_test.go packages/sutra-knowledge/action-protocol/bridge_linux.go packages/sutra-knowledge/action-protocol/bridge_linux_test.go packages/sutra-knowledge/action-protocol/grant_linux.go packages/sutra-knowledge/action-protocol/grant_linux_test.go packages/sutra-knowledge/action-protocol/fence_linux.go packages/sutra-knowledge/action-protocol/fence_linux_test.go packages/sutra-knowledge/action-protocol/upstream_types_linux.go packages/sutra-knowledge/action-protocol/upstream_store_core_linux.go packages/sutra-knowledge/action-protocol/upstream_store_ops_linux.go packages/sutra-knowledge/action-protocol/upstream_transport_linux.go packages/sutra-knowledge/action-protocol/upstream_witness_linux.go packages/sutra-knowledge/action-protocol/upstream_witness_linux_test.go packages/sutra-knowledge/action-protocol/upstream_witness_refinement_linux_test.go packages/sutra-knowledge/action-protocol/upstream_core_linux_test.go packages/sutra-knowledge/action-protocol/upstream_rollback_linux_test.go packages/sutra-knowledge/action-protocol/upstream_network_linux_test.go packages/sutra-knowledge/action-protocol/upstream_refinement_linux_test.go packages/sutra-knowledge/action-protocol/upstream_transaction_linux.go packages/sutra-knowledge/action-protocol/upstream_transaction_linux_test.go packages/sutra-knowledge/action-protocol/pinned_upstream_transaction_linux.go packages/sutra-knowledge/action-protocol/pinned_upstream_transaction_linux_test.go packages/sutra-knowledge/action-protocol/compensation_linux.go packages/sutra-knowledge/action-protocol/compensation_linux_test.go packages/sutra-knowledge/action-protocol/pinned_policy_refinement_linux_test.go packages/sutra-knowledge/action-protocol/fenced_grant_linux.go packages/sutra-knowledge/action-protocol/fenced_grant_linux_test.go packages/sutra-knowledge/action-protocol/grant_policy_linux.go packages/sutra-knowledge/action-protocol/grant_policy_linux_test.go packages/sutra-knowledge/action-protocol/anchored_external_linux.go packages/sutra-knowledge/action-protocol/anchored_external_linux_test.go packages/sutra-knowledge/action-protocol/http_surface_linux_test.go
      - name: Independently map actual Go authority trace to bounded TLA transitions
        run: |
          python3 packages/sutra-knowledge/action-protocol/formal/refine_trace.py sutra-v2-authority-trace.json > sutra-v2-authority-refinement.json
          cat sutra-v2-authority-refinement.json
      - name: Independently map actual Go bridge crash and lost-response traces
        run: |
          python3 packages/sutra-knowledge/action-protocol/formal/refine_bridge_trace.py sutra-v2-bridge-traces > sutra-v2-bridge-refinement.json
          cat sutra-v2-bridge-refinement.json
      - name: Independently map actual Go upstream terminal traces
        run: |
          python3 packages/sutra-knowledge/action-protocol/formal/refine_upstream_trace.py sutra-v2-upstream-trace.json > sutra-v2-upstream-refinement.json
          cat sutra-v2-upstream-refinement.json
          python3 packages/sutra-knowledge/action-protocol/formal/refine_upstream_trace_mutants.py sutra-v2-upstream-trace.json > sutra-v2-upstream-refinement-mutants.json
          cat sutra-v2-upstream-refinement-mutants.json
      - name: Independently map actual Go upstream witness traces
        run: |
          python3 packages/sutra-knowledge/action-protocol/formal/refine_upstream_witness_trace.py sutra-v2-upstream-witness-trace.json > sutra-v2-upstream-witness-refinement.json
          cat sutra-v2-upstream-witness-refinement.json
          python3 packages/sutra-knowledge/action-protocol/formal/refine_upstream_witness_trace_mutants.py sutra-v2-upstream-witness-trace.json > sutra-v2-upstream-witness-refinement-mutants.json
          cat sutra-v2-upstream-witness-refinement-mutants.json
      - name: Independently map actual Go pinned consent-policy traces
        run: |
          python3 packages/sutra-knowledge/action-protocol/formal/refine_pinned_policy_trace.py sutra-v2-pinned-policy-trace.json > sutra-v2-pinned-policy-refinement.json
          cat sutra-v2-pinned-policy-refinement.json
          python3 packages/sutra-knowledge/action-protocol/formal/refine_pinned_policy_trace_mutants.py sutra-v2-pinned-policy-trace.json > sutra-v2-pinned-policy-refinement-mutants.json
          cat sutra-v2-pinned-policy-refinement-mutants.json
      - name: Bounded recovery state model and unsafe counterexample
        run: sh packages/sutra-knowledge/action-protocol/formal/check.sh
      - name: Rust bounded support lattice and exhaustive reference controls
        run: |
          rustc --version
          rustc --edition=2021 -O --test packages/sutra-knowledge/support-lattice/lib.rs -o /tmp/sutra-support-tests
          /tmp/sutra-support-tests
          rustc --edition=2021 -O --test packages/sutra-knowledge/support-lattice/wasm.rs -o /tmp/sutra-support-abi-tests
          /tmp/sutra-support-abi-tests
      - run: node --test packages/sutra-knowledge/test/*.test.mjs
      - name: Run matched semantic execution-signature development pilot
        run: node packages/sutra-knowledge/evaluation/semantic-signature-pilot.mjs
      - name: Independently compare two-group conditional arithmetic
        run: |
          node packages/sutra-knowledge/examples/fisher-reference-cases.mjs > sutra-fisher-reference-cases.json
          python3 packages/sutra-knowledge/reference/test_reviewed_fisher.py < sutra-fisher-reference-cases.json
      - name: Independently compare source-withdrawal transformation and adversarial dependency classes
        run: |
          node packages/sutra-knowledge/examples/withdrawal-reference-cases.mjs > sutra-withdrawal-reference-cases.json
          python3 packages/sutra-knowledge/reference/test_withdrawal_revision.py < sutra-withdrawal-reference-cases.json
      - name: Independently verify atomic evidence revision and repinned plan tampering
        run: |
          node packages/sutra-knowledge/examples/evidence-revision-reference-cases.mjs > sutra-evidence-revision-reference-cases.json
          python3 packages/sutra-knowledge/reference/test_evidence_revision.py < sutra-evidence-revision-reference-cases.json
      - name: Independently verify minimal semantic probe suite against combination enumeration
        run: |
          node packages/sutra-knowledge/examples/probe-suite-reference-cases.mjs > sutra-probe-suite-reference-cases.json
          python3 packages/sutra-knowledge/reference/test_semantic_probe_suite.py < sutra-probe-suite-reference-cases.json
      - name: Execute frozen 40-case assumption benchmark against matched review selectors
        run: |
          result=0
          node packages/sutra-knowledge/evaluation/assumption-development.mjs > sutra-assumption-development.json || result=$?
          node -e "const r=require('./sutra-assumption-development.json'); console.log(JSON.stringify({...r,rows:r.rows.filter(x=>!x.exactMatch)},null,2))"
          exit "$result"
      - name: Execute frozen 40-case atomic revision development benchmark
        run: |
          result=0
          node packages/sutra-knowledge/evaluation/revision-development.mjs sutra-revision-development-bundles.json > sutra-revision-development.json || result=$?
          node -e "const r=require('./sutra-revision-development.json'); console.log(JSON.stringify({...r,rows:r.rows.filter(x=>!x.exactMatch)},null,2))"
          exit "$result"
      - name: Independently reconstruct explicit evidence recovery and offline archive
        run: |
          node packages/sutra-knowledge/examples/evidence-recovery-reference-cases.mjs > sutra-evidence-recovery-reference-cases.json
          python3 packages/sutra-knowledge/reference/test_evidence_recovery.py < sutra-evidence-recovery-reference-cases.json
      - name: Independently replay frozen atomic revision benchmark exports
        run: python3 packages/sutra-knowledge/reference/test_revision_development.py sutra-revision-development-bundles.json
      - name: Independently compare restricted question grammar across languages
        run: |
          node packages/sutra-knowledge/examples/question-reference-cases.mjs > sutra-question-reference-cases.json
          python3 packages/sutra-knowledge/reference/test_reviewed_question.py < sutra-question-reference-cases.json
      - name: Independently reconstruct signed difference and relative change questions
        run: |
          node packages/sutra-knowledge/examples/change-question-reference-cases.mjs > sutra-change-question-reference-cases.json
          python3 packages/sutra-knowledge/reference/test_reviewed_change_question.py < sutra-change-question-reference-cases.json
      - name: Execute frozen synthetic living-knowledge pilot and scoped baseline comparison
        run: node packages/sutra-knowledge/evaluation/living-pilot.mjs
      - name: Measure actual provenance-bound revision replay against fresh exact parity
        run: node packages/sutra-knowledge/evaluation/revision-session-pilot.mjs
      - name: Execute frozen revision selection pilot
        run: |
          node packages/sutra-knowledge/evaluation/revision-selection-pilot.mjs > sutra-v2-revision-pilot.json
          cat sutra-v2-revision-pilot.json
      - name: Execute and assert capability demonstration
        run: |
          node packages/sutra-knowledge/examples/observatory.mjs > sutra-v2-observation.json
          cat sutra-v2-observation.json
      - name: Execute finite-world observation planning challenge
        run: |
          node --input-type=module -e "import {demonstrateFrontier} from './packages/sutra-knowledge/examples/frontier.mjs'; console.log(JSON.stringify(await demonstrateFrontier(),null,2));" > sutra-v2-frontier.json
          cat sutra-v2-frontier.json
      - name: Execute conflicting source and lineage withdrawal challenge
        run: |
          node --input-type=module -e "import {demonstrateConflict} from './packages/sutra-knowledge/examples/conflict.mjs'; console.log(JSON.stringify(await demonstrateConflict(),null,2));" > sutra-v2-conflict.json
          cat sutra-v2-conflict.json
      - name: Independent Python reference replay
        run: |
          node packages/sutra-knowledge/examples/export-challenges.mjs > sutra-v2-challenges.json
          python3 packages/sutra-knowledge/reference/verify.py sutra-v2-challenges.json > sutra-v2-reference.json
          cat sutra-v2-reference.json
      - uses: actions/upload-artifact@v4
        with:
          name: sutra-v2-observation
          path: |
            sutra-v2-observation.json
            sutra-v2-revision-pilot.json
            sutra-assumption-development.json
            sutra-revision-development.json
            sutra-revision-development-bundles.json
            sutra-evidence-recovery-reference-cases.json
            sutra-v2-frontier.json
            sutra-v2-conflict.json
            sutra-v2-challenges.json
            sutra-v2-reference.json
            sutra-v2-authority-trace.json
            sutra-v2-authority-refinement.json
            sutra-v2-upstream-trace.json
            sutra-v2-upstream-refinement.json
            sutra-v2-upstream-refinement-mutants.json
            sutra-v2-upstream-witness-trace.json
            sutra-v2-upstream-witness-refinement.json
            sutra-v2-upstream-witness-refinement-mutants.json
            sutra-v2-pinned-policy-trace.json
            sutra-v2-pinned-policy-refinement.json
            sutra-v2-pinned-policy-refinement-mutants.json
            sutra-v2-bridge-traces/
            sutra-v2-bridge-refinement.json
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/sutra/package-lock.json
      - name: Preflight browser journey syntax before dependencies and build
        run: node --check apps/sutra-v2/test/browser.cjs
      - run: npm ci --prefix apps/sutra
      - name: Build isolated Rust WebAssembly support engine and canonical SUTRA v2 browser artifact
        run: |
          rustc --version
          rustup target add wasm32-unknown-unknown
          node apps/sutra-v2/build.mjs
          node --test apps/sutra-v2/test/build-contract.test.mjs
      - run: node packages/sutra-runtime/verify-vendor.mjs
      - run: node apps/sutra/node_modules/playwright/cli.js install --with-deps chromium
      - name: Check guided route against actual replayed investigation states
        run: node --test apps/sutra-v2/test/demo-guide.test.mjs
      - run: node apps/sutra-v2/test/browser.cjs
      - name: Independently replay actual learner browser export and challenge tampering
        run: |
          python3 packages/sutra-knowledge/reference/verify_learner.py apps/sutra-v2/test-output/learning-evidence.json apps/sutra/public > apps/sutra-v2/test-output/learning-reference.txt
          cat apps/sutra-v2/test-output/learning-reference.txt
      - name: Independently replay subgroup investigation and withdrawal
        run: |
          python3 packages/sutra-knowledge/reference/verify_quiz.py apps/sutra-v2/test-output/quiz-evidence.json apps/sutra-v2/test-output/quiz-withdrawal.json > apps/sutra-v2/test-output/quiz-reference.txt
          cat apps/sutra-v2/test-output/quiz-reference.txt
      - name: Independently replay generalized conflict browser exports and challenge tampering
        run: |
          python3 packages/sutra-knowledge/reference/verify_conflict.py apps/sutra-v2/test-output/conflict-evidence.json apps/sutra-v2/test-output/conflict-withdrawn.json apps/sutra-v2/test-output/conflict-resolved.json > apps/sutra-v2/test-output/conflict-reference.txt
          cat apps/sutra-v2/test-output/conflict-reference.txt
      - name: Independently replay conclusion debugger attack states and reject artifact tampering
        run: |
          python3 packages/sutra-knowledge/reference/verify_debugger.py apps/sutra-v2/test-output/debugger-baseline.json apps/sutra-v2/test-output/debugger-withdrawn.json apps/sutra-v2/test-output/debugger-copied.json apps/sutra-v2/test-output/debugger-conflicted.json apps/sutra-v2/test-output/debugger-repaired.json apps/sutra-v2/test-output/debugger-resolved.json > apps/sutra-v2/test-output/debugger-reference.txt
          cat apps/sutra-v2/test-output/debugger-reference.txt
      - name: Independently verify actual Proof Capsule bytes and historical state counterexample
        run: |
          python3 packages/sutra-knowledge/reference/verify_capsule.py --challenge apps/sutra-v2/test-output/capsule-current.json apps/sutra-v2/test-output/capsule-current.sha256 apps/sutra-v2/test-output/capsule-old.json apps/sutra-v2/test-output/capsule-old.sha256 > apps/sutra-v2/test-output/capsule-reference.txt
          cat apps/sutra-v2/test-output/capsule-reference.txt
      - name: Independently replay conditional support and decisive observation explanations
        run: |
          python3 packages/sutra-knowledge/reference/verify_explanation.py apps/sutra-v2/test-output/explanation-conflict.json apps/sutra-v2/test-output/explanation-opposite.json apps/sutra-v2/test-output/explanation-plan.json apps/sutra-v2/test-output/explanation-impossible.json > apps/sutra-v2/test-output/explanation-reference.txt
          cat apps/sutra-v2/test-output/explanation-reference.txt
      - name: Independently replay actual world traces and blocking-root counterexamples
        run: |
          python3 packages/sutra-knowledge/reference/verify_world_trace.py apps/sutra-v2/test-output/world-trace-baseline.json apps/sutra-v2/test-output/world-trace-withdrawn.json apps/sutra-v2/test-output/world-trace-copied.json apps/sutra-v2/test-output/world-trace-conflicted.json apps/sutra-v2/test-output/world-trace-resolved.json > apps/sutra-v2/test-output/world-trace-reference.txt
          cat apps/sutra-v2/test-output/world-trace-reference.txt
      - name: Independently replay exact assumption variants and reject scope leakage
        run: |
          python3 packages/sutra-knowledge/reference/verify_assumptions.py apps/sutra-v2/test-output/assumption-baseline.json apps/sutra-v2/test-output/assumption-withdrawn.json apps/sutra-v2/test-output/assumption-conflicted.json apps/sutra-v2/test-output/assumption-resolved.json > apps/sutra-v2/test-output/assumption-reference.txt
          cat apps/sutra-v2/test-output/assumption-reference.txt
      - name: Execute actual downloaded offline Proof Capsule verifier in isolated Python
        run: |
          python3 packages/sutra-knowledge/reference/test_offline_verifier.py apps/sutra-v2/test-output/sutra-proof-verifier.pyz apps/sutra-v2/test-output/sutra-proof-verifier.pyz.sha256 apps/sutra-v2/test-output/capsule-current.json apps/sutra-v2/test-output/capsule-current.sha256 apps/sutra-v2/test-output/capsule-old.json apps/sutra-v2/test-output/capsule-old.sha256 > apps/sutra-v2/test-output/offline-verifier-reference.txt
          cat apps/sutra-v2/test-output/offline-verifier-reference.txt
      - name: Differentially challenge JavaScript and actual downloaded independent Python verifier
        run: |
          node packages/sutra-knowledge/examples/capsule-parity.mjs apps/sutra-v2/test-output/capsule-current.json apps/sutra-v2/test-output/capsule-current.sha256 apps/sutra-v2/test-output/capsule-old.json apps/sutra-v2/test-output/capsule-old.sha256 apps/sutra-v2/test-output/sutra-proof-verifier.pyz > apps/sutra-v2/test-output/capsule-parity.txt
          cat apps/sutra-v2/test-output/capsule-parity.txt
      - name: Independently reconstruct caller-pinned nonbinary finite investigations
        run: |
          python3 packages/sutra-knowledge/reference/verify_pinned_investigation.py --challenge apps/sutra-v2/test-output/pinned-baseline.json apps/sutra-v2/test-output/pinned-conflict.json apps/sutra-v2/test-output/pinned-resolved.json > apps/sutra-v2/test-output/pinned-reference.txt
          cat apps/sutra-v2/test-output/pinned-reference.txt
      - name: Challenge actual aligned capsules using downloaded independent verifier
        run: |
          node packages/sutra-knowledge/examples/aligned-capsule-parity.mjs apps/sutra-v2/test-output/aligned-current.json apps/sutra-v2/test-output/aligned-current.sha256 apps/sutra-v2/test-output/aligned-old.json apps/sutra-v2/test-output/aligned-old.sha256 apps/sutra-v2/test-output/sutra-proof-verifier.pyz > apps/sutra-v2/test-output/aligned-capsule-reference.txt
          cat apps/sutra-v2/test-output/aligned-capsule-reference.txt
      - name: Independently replay hypothetical measurement intervals and shared-root relaxation
        run: |
          python3 packages/sutra-knowledge/reference/verify_measurement_sensitivity.py --challenge apps/sutra-v2/test-output/measurement-conflict.json apps/sutra-v2/test-output/measurement-resolved.json > apps/sutra-v2/test-output/measurement-reference.txt
          cat apps/sutra-v2/test-output/measurement-reference.txt
      - name: Independently replay compatible and excluded omitted-world counterexamples
        run: |
          python3 packages/sutra-knowledge/reference/verify_world_coverage.py --challenge apps/sutra-v2/test-output/coverage-compatible.json apps/sutra-v2/test-output/coverage-incompatible.json > apps/sutra-v2/test-output/coverage-reference.txt
          cat apps/sutra-v2/test-output/coverage-reference.txt
      - name: Independently replay opposite and false competing agent proposals
        run: |
          python3 packages/sutra-knowledge/reference/verify_proposal_challenge.py --challenge apps/sutra-v2/test-output/proposal-correct.json apps/sutra-v2/test-output/proposal-forged.json > apps/sutra-v2/test-output/proposal-reference.txt
          cat apps/sutra-v2/test-output/proposal-reference.txt
      - name: Independently replay cross-branch receipt-only conflict and false-claim distinction
        run: |
          python3 packages/sutra-knowledge/reference/verify_proposal_clash.py --challenge apps/sutra-v2/test-output/clash-cross.json apps/sutra-v2/test-output/clash-compatible.json > apps/sutra-v2/test-output/clash-reference.txt
          cat apps/sutra-v2/test-output/clash-reference.txt
      - name: Independently replay observed-domain omitted combination audit
        run: |
          python3 packages/sutra-knowledge/reference/verify_coverage_grid.py --challenge apps/sutra-v2/test-output/grid-compatible.json apps/sutra-v2/test-output/grid-excluded.json > apps/sutra-v2/test-output/grid-reference.txt
          cat apps/sutra-v2/test-output/grid-reference.txt
      - name: Independently replay discrete assumption contrast and joint reversal
        run: |
          python3 packages/sutra-knowledge/reference/verify_assumption_contrast.py --challenge apps/sutra-v2/test-output/contrast-compatible.json apps/sutra-v2/test-output/contrast-excluded.json > apps/sutra-v2/test-output/contrast-reference.txt
          cat apps/sutra-v2/test-output/contrast-reference.txt
