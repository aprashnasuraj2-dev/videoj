name: SUTRA autonomous research
on:
  pull_request:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test --prefix packages/sutra-research
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: sutra_ci
          POSTGRES_PASSWORD: sutra_ci_fixture
          POSTGRES_DB: sutra_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sutra_ci -d sutra_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix packages/sutra-research --no-save --package-lock=false --ignore-scripts pg@8.16.3
      - run: node --test packages/sutra-research/test/postgres.integration.mjs
        env:
          SUTRA_TEST_POSTGRES: postgresql://sutra_ci:sutra_ci_fixture@127.0.0.1:5432/sutra_ci
  pdf-sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap poppler-utils poppler-data apparmor-profiles
          bwrap --version
          pdftotext -v
      - name: Enable only the distribution's restricted Bubblewrap AppArmor profile
        shell: bash
        run: |
          set -euo pipefail
          before="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)"
          echo "Global user namespace restriction: $before"
          if [ "$before" = 1 ]; then
            profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
            if [ -f /etc/apparmor.d/bwrap-userns-restrict ]; then
              profile=/etc/apparmor.d/bwrap-userns-restrict
            fi
            test -f "$profile"
            # Use distro-supplied capability-dropping child profile, never a global sysctl override.
            grep -q 'profile unpriv_bwrap' "$profile"
            grep -q 'deny capability' "$profile"
            sudo apparmor_parser -r "$profile"
          fi
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = "$before"
      - name: Probe sandbox as a dedicated unprivileged user with no other processes
        run: |
          sudo useradd --system --no-create-home sutra-pdf-ci
          sudo install -d -m 0755 /tmp/sutra-pdf-ci
          sudo cp -R packages/sutra-research packages/sutra-consent /tmp/sutra-pdf-ci/
          sudo chmod -R a+rX /tmp/sutra-pdf-ci
          sudo install -m 0755 "$(command -v node)" /tmp/sutra-pdf-ci/node
          sudo runuser -u sutra-pdf-ci -- sh -c 'cd /tmp/sutra-pdf-ci && exec ./node --test sutra-research/test/pdf-sandbox.integration.mjs'
