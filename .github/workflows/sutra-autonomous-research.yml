name: SUTRA autonomous research
on:
  pull_request:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test --prefix packages/sutra-research
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: sutra_ci
          POSTGRES_PASSWORD: sutra_ci_fixture
          POSTGRES_DB: sutra_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sutra_ci -d sutra_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix packages/sutra-research --no-save --package-lock=false --ignore-scripts pg@8.16.3
      - run: node --test packages/sutra-research/test/postgres.integration.mjs
        env:
          SUTRA_TEST_POSTGRES: postgresql://sutra_ci:sutra_ci_fixture@127.0.0.1:5432/sutra_ci
  pdf-sandbox:
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap poppler-utils poppler-data
          bwrap --version
          pdftotext -v
      - run: node --test packages/sutra-research/test/pdf-sandbox.integration.mjs
