name: SUTRA autonomous research
on:
  pull_request:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact candidate checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test --prefix packages/sutra-research
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: sutra_ci
          POSTGRES_PASSWORD: sutra_ci_fixture
          POSTGRES_DB: sutra_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sutra_ci -d sutra_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact candidate checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix packages/sutra-research --no-save --package-lock=false --ignore-scripts pg@8.16.3
      - run: node --test packages/sutra-research/test/postgres.integration.mjs
        env:
          SUTRA_TEST_POSTGRES: postgresql://sutra_ci:sutra_ci_fixture@127.0.0.1:5432/sutra_ci
  pdf-sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact candidate checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap poppler-utils poppler-data apparmor-profiles
          uname -r
          dpkg-query -W bubblewrap poppler-utils poppler-data apparmor-profiles
          bwrap --version
          bwrap --help | grep -- --disable-userns
          pdftotext -v
      - name: Enable only the distribution's restricted Bubblewrap AppArmor profile
        shell: bash
        run: |
          set -euo pipefail
          before="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)"
          echo "Global user namespace restriction: $before"
          # This job validates the restricted Ubuntu host, not an unrestricted substitute.
          test "$before" = 1
          if [ "$before" = 1 ]; then
            profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
            if [ -f /etc/apparmor.d/bwrap-userns-restrict ]; then
              profile=/etc/apparmor.d/bwrap-userns-restrict
            fi
            test -f "$profile"
            # Use distro-supplied capability-dropping child profile, never a global sysctl override.
            grep -q 'profile unpriv_bwrap' "$profile"
            grep -q 'deny capability' "$profile"
            sudo apparmor_parser -r "$profile"
            sha256sum "$profile"
            sudo grep -E "^(unpriv_bwrap|bwrap|/usr/bin/bwrap) " /sys/kernel/security/apparmor/profiles
          fi
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = "$before"
      - name: Probe sandbox as a dedicated unprivileged user with no other processes
        run: |
          sudo useradd --system --no-create-home sutra-pdf-ci
          sudo install -d -m 0755 /tmp/sutra-pdf-ci
          sudo cp -R packages/sutra-research packages/sutra-consent /tmp/sutra-pdf-ci/
          sudo chmod -R a+rX /tmp/sutra-pdf-ci
          cc -O2 -Wall -Wextra -Werror packages/sutra-research/test/pdf-isolation-probe.c -o "$RUNNER_TEMP/pdf-isolation-probe"
          sudo install -m 0755 "$RUNNER_TEMP/pdf-isolation-probe" /tmp/sutra-pdf-ci/sutra-research/test/pdf-isolation-probe
          echo synthetic-host-canary | sudo tee /tmp/sutra-pdf-ci/host-canary >/dev/null
          sudo install -m 0755 "$(command -v node)" /tmp/sutra-pdf-ci/node
          # Negative control: the same probe must reject the unisolated process.
          sudo runuser -u sutra-pdf-ci -- sh -c '
            net=$(stat -Lc "%i" /proc/self/ns/net)
            pid=$(stat -Lc "%i" /proc/self/ns/pid)
            if /tmp/sutra-pdf-ci/sutra-research/test/pdf-isolation-probe "$net" "$pid" 1 >/tmp/sutra-pdf-negative.log 2>&1; then
              echo "ERROR: native probe accepted an unisolated process"; exit 1
            fi
            grep -Fx "isolation failed: network namespace" /tmp/sutra-pdf-negative.log
          '
          set -o pipefail
          sudo runuser -u sutra-pdf-ci -- sh -c 'cd /tmp/sutra-pdf-ci && exec ./node --test sutra-research/test/pdf-sandbox.integration.mjs' | tee "$RUNNER_TEMP/pdf-sandbox.tap"
      - name: Preserve host isolation test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sutra-pdf-sandbox-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/pdf-sandbox.tap
          if-no-files-found: warn
      - name: Confirm restriction remains enabled
        if: always()
        run: test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
