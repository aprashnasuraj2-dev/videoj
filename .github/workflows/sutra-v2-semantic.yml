name: Validate SUTRA semantic acceptance
on:
  pull_request:
    branches: ['main']
    paths:
      - 'packages/sutra-knowledge/semantic-*.js'
      - 'packages/sutra-knowledge/controlled-intent-roundtrip.js'
      - 'packages/sutra-knowledge/clarification-*.js'
      - 'packages/sutra-knowledge/evaluation/ambient-*.jsonl'
      - 'packages/sutra-knowledge/evaluation/semantic-*.json'
      - 'packages/sutra-knowledge/evaluation/semantic-*.jsonl'
      - 'packages/sutra-knowledge/evaluation/**'
      - 'packages/sutra-knowledge/reference/**'
      - 'packages/sutra-knowledge/test/semantic-*.test.mjs'
      - 'packages/sutra-knowledge/test/controlled-intent-roundtrip.test.mjs'
      - 'packages/sutra-knowledge/test/ambient-human-ambiguity.test.mjs'
      - 'packages/sutra-knowledge/test/clarification-*.test.mjs'
      - 'docs/sutra-v2/evaluation/third-party/AmbiEnt-ATTRIBUTION.md'
      - '.github/workflows/sutra-v2-semantic.yml'
  push:
    branches: ['main']
    paths:
      - 'packages/sutra-knowledge/semantic-*.js'
      - 'packages/sutra-knowledge/controlled-intent-roundtrip.js'
      - 'packages/sutra-knowledge/clarification-*.js'
      - 'packages/sutra-knowledge/evaluation/ambient-*.jsonl'
      - 'packages/sutra-knowledge/evaluation/semantic-*.json'
      - 'packages/sutra-knowledge/evaluation/semantic-*.jsonl'
      - 'packages/sutra-knowledge/evaluation/**'
      - 'packages/sutra-knowledge/reference/**'
      - 'packages/sutra-knowledge/test/semantic-*.test.mjs'
      - 'packages/sutra-knowledge/test/controlled-intent-roundtrip.test.mjs'
      - 'packages/sutra-knowledge/test/ambient-human-ambiguity.test.mjs'
      - 'packages/sutra-knowledge/test/clarification-*.test.mjs'
      - 'docs/sutra-v2/evaluation/third-party/AmbiEnt-ATTRIBUTION.md'
      - '.github/workflows/sutra-v2-semantic.yml'
permissions:
  contents: read
jobs:
  semantic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact semantic candidate revision
        env:
          EXPECTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run bounded semantic acceptance tests
        run: |
          node --test \
            packages/sutra-knowledge/test/semantic-context-analyzer.test.mjs \
            packages/sutra-knowledge/test/semantic-question-engine.test.mjs \
            packages/sutra-knowledge/test/semantic-intent-ir.test.mjs \
            packages/sutra-knowledge/test/controlled-intent-roundtrip.test.mjs \
            packages/sutra-knowledge/test/semantic-input-pathways.test.mjs \
            packages/sutra-knowledge/test/semantic-pathway-sealing.test.mjs \
            packages/sutra-knowledge/test/semantic-intake-security.test.mjs \
            packages/sutra-knowledge/test/semantic-counterfactual.test.mjs \
            packages/sutra-knowledge/test/semantic-world-grid.test.mjs \
            packages/sutra-knowledge/test/semantic-probe-suite.test.mjs \
            packages/sutra-knowledge/test/clarification-plan.test.mjs \
            packages/sutra-knowledge/test/ambient-human-ambiguity.test.mjs \
            packages/sutra-knowledge/test/semantic-model-authored-corpus.test.mjs \
            packages/sutra-knowledge/test/semantic-operation-heldout.test.mjs \
            packages/sutra-knowledge/test/semantic-review-burden.test.mjs \
            packages/sutra-knowledge/test/semantic-gap-review-plan.test.mjs
      - name: Emit semantic review and residual-error measurement
        run: |
          node packages/sutra-knowledge/evaluation/semantic-review-burden.mjs > sutra-semantic-review-burden.json
          cat sutra-semantic-review-burden.json
      - name: Verify external-human and model-authored corpus boundaries
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const full=fs.readFileSync('packages/sutra-knowledge/evaluation/ambient-human-full-v1.jsonl','utf8').trim().split('\n');
          const linguists=fs.readFileSync('packages/sutra-knowledge/evaluation/ambient-linguist-annotations-v1.jsonl','utf8').trim().split('\n');
          const m=JSON.parse(fs.readFileSync('packages/sutra-knowledge/evaluation/semantic-model-authored-manifest-v1.json','utf8'));
          if(full.length!==1645||linguists.length!==2020||m.counts.cases!==4000||m.humanAnnotation!==false||m.hiddenTrainingExampleClaim!==false)process.exit(1);
          console.log(JSON.stringify({ambientFinal:full.length,ambientRawLinguistRecords:linguists.length,syntheticCases:m.counts.cases,syntheticFamilies:m.counts.families,syntheticDomains:m.counts.domains}));
          NODE

      - name: Execute full corpus and frozen scenario split
        env:
          SUTRA_SEMANTIC_CORPUS_REPORT: sutra-semantic-corpus.json
          SUTRA_SEMANTIC_CONTRAST_REPORT: sutra-semantic-contrast.json
          SUTRA_TEMPORAL_CORPUS_REPORT: sutra-temporal-corpus.json
        run: |
          node --test packages/sutra-knowledge/test/semantic-corpus-execution.test.mjs packages/sutra-knowledge/test/semantic-split-v2.test.mjs packages/sutra-knowledge/test/semantic-temporal-selector-v3.test.mjs
          node packages/sutra-knowledge/evaluation/semantic-scenario-v2.mjs > sutra-scenario-split.json
      - name: Emit blinded direct-human evidence gap plan
        run: |
          node packages/sutra-knowledge/evaluation/semantic-gap-review-plan.mjs > sutra-semantic-gap-review-plan.json
          node packages/sutra-knowledge/evaluation/semantic-gap-review-plan.mjs --packet sutra-semantic-gap-review-packet.json
          python3 packages/sutra-knowledge/evaluation/semantic-human-review.py --self-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sutra-semantic-acceptance-${{ github.event.pull_request.head.sha || github.sha }}
          path: sutra-*.json
          if-no-files-found: warn
