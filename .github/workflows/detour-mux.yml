name: Provision DETOUR Mux bonus
on:
  workflow_dispatch:
  push:
    branches: [detour]
    paths:
      - 'detour/scripts/mux-provision.mjs'
      - '.github/workflows/detour-mux.yml'

concurrency:
  group: detour-mux-bonus
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check optional Mux credentials
        id: credentials
        env:
          MUX_TOKEN_ID: ${{ secrets.MUX_TOKEN_ID }}
          MUX_TOKEN_SECRET: ${{ secrets.MUX_TOKEN_SECRET }}
        run: |
          if [[ -n "$MUX_TOKEN_ID" && -n "$MUX_TOKEN_SECRET" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Optional Mux provisioning not attempted: configure both MUX_TOKEN_ID and MUX_TOKEN_SECRET as GitHub Actions repository secrets."
            echo "### DETOUR optional Mux bonus: not provisioned" >> "$GITHUB_STEP_SUMMARY"
            echo "Missing one or both repository secrets. The independently verified R2/MP4 release remains the fallback; this workflow does **not** qualify Mux." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Provision or reuse DETOUR content-hash asset
        if: steps.credentials.outputs.ready == 'true'
        env:
          MUX_TOKEN_ID: ${{ secrets.MUX_TOKEN_ID }}
          MUX_TOKEN_SECRET: ${{ secrets.MUX_TOKEN_SECRET }}
        run: node detour/scripts/mux-provision.mjs
      - name: Preserve public Mux configuration
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: detour-mux-public-${{ github.sha }}
          path: detour/.mux/public.json
          if-no-files-found: error
          retention-days: 14
      - name: Provision or reuse Aafnai Patro editorial Mux media
        if: steps.credentials.outputs.ready == 'true'
        env:
          MUX_TOKEN_ID: ${{ secrets.MUX_TOKEN_ID }}
          MUX_TOKEN_SECRET: ${{ secrets.MUX_TOKEN_SECRET }}
        run: node detour/scripts/live-site-mux-provision.mjs
      - name: Preserve Aafnai Patro editorial Mux configuration
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: detour-live-site-mux-${{ github.sha }}
          path: detour/.mux/live-site.json
          if-no-files-found: error
          retention-days: 14
