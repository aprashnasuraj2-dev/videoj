name: Validate SUTRA independent held-out FinQA benchmark
# Canonical SUTRA main-line verification. Exact-head sweep marker.
on:
  push:
    branches: ['main', 'sutra/v2-knowledge-compiler']
    paths: ['packages/sutra-knowledge/evaluation/finqa-public-test-heldout.json','packages/sutra-knowledge/finqa-heldout-benchmark.js','packages/sutra-knowledge/reference/score_finqa_heldout.py','packages/sutra-knowledge/evaluation/run-finqa-heldout.mjs','.github/workflows/sutra-v2-finqa-benchmark.yml']
  pull_request:
    branches: ['main']
    paths: ['packages/sutra-knowledge/evaluation/finqa-public-test-heldout.json','packages/sutra-knowledge/finqa-heldout-benchmark.js','packages/sutra-knowledge/reference/score_finqa_heldout.py','packages/sutra-knowledge/evaluation/run-finqa-heldout.mjs','.github/workflows/sutra-v2-finqa-benchmark.yml']
permissions:
  contents: read
jobs:
  finqa-heldout:
    if: github.event_name == 'push' || github.head_ref == 'sutra/v2-parallel/10-benchmark' || github.head_ref == 'sutra/v2-validation/v2-182'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - name: Produce exact case-level predictions
        run: node packages/sutra-knowledge/evaluation/run-finqa-heldout.mjs > finqa-heldout-predictions.json
      - name: Independently score predictions and coverage
        run: python3 packages/sutra-knowledge/reference/score_finqa_heldout.py packages/sutra-knowledge/evaluation/finqa-public-test-heldout.json finqa-heldout-predictions.json > finqa-heldout-score.json
      - name: Show bounded benchmark result
        run: cat finqa-heldout-score.json
      - uses: actions/upload-artifact@v4
        with:
          name: sutra-finqa-heldout
          path: |
            finqa-heldout-predictions.json
            finqa-heldout-score.json
