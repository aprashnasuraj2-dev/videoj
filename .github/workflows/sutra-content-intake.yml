name: Validate SUTRA real-content intake gate
on:
  pull_request:
    paths:
      - 'tools/sutra-content-intake/**'
      - '.github/workflows/sutra-content-intake.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/sutra-content-intake/*.test.mjs
