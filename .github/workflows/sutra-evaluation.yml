name: Validate SUTRA engineering evaluation
on:
  pull_request:
    paths:
      - 'apps/sutra/src/comparison.js'
      - 'apps/sutra/src/uncertainty-guidance.js'
      - 'apps/sutra/src/direct-lookup.js'
      - 'apps/sutra/src/receipt-actions.js'
      - 'apps/sutra/src/fixtures/**'
      - 'apps/sutra/public/content/**'
      - 'apps/sutra/public/agents/source_learner.network.json'
      - 'packages/sutra-runtime/**'
      - 'packages/sutra-evidence/**'
      - 'packages/sutra-source-tools/**'
      - 'packages/sutra-content-profile/**'
      - 'services/sutra-api/**'
      - 'tools/sutra-evaluation/**'
      - 'docs/sutra/evaluation/**'
      - 'docs/sutra/verification-map.json'
      - 'docs/sutra/evidence/metrics.json'
      - 'docs/sutra/tools/impact.mjs'
      - '.github/workflows/sutra-evaluation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run_evaluation: ${{ steps.gate.outputs.run_evaluation }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: gate
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          node docs/sutra/tools/impact.mjs --metrics "$TARGET_SHA" > "$RUNNER_TEMP/metrics.json"
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/metrics.json'));const m=d.metrics.find(x=>x.id==='engineering_baseline');const force=process.env.FORCE_RUN==='true';fs.appendFileSync(process.env.GITHUB_OUTPUT,'run_evaluation='+(force||!m||m.status==='stale')+'\n');"
          cat "$RUNNER_TEMP/metrics.json"
  baseline:
    needs: freshness
    if: ${{ github.event_name == 'workflow_dispatch' || needs.freshness.outputs.run_evaluation == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/sutra-evaluation/*.test.mjs
      - run: node tools/sutra-evaluation/baseline.mjs > "${RUNNER_TEMP}/sutra-engineering-evaluation.json"
      - uses: actions/upload-artifact@v4
        with:
          name: sutra-engineering-evaluation
          path: ${{ runner.temp }}/sutra-engineering-evaluation.json
  historical-source-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1ab497bb706ed1f1d7c8e921cd037b1abb1fa87d
          path: historical-pr49
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce frozen historical failures and validate unchanged expectations in candidate
        shell: bash
        env:
          EXPECTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git -C historical-pr49 rev-parse HEAD)" = 1ab497bb706ed1f1d7c8e921cd037b1abb1fa87d
          test "$(git -C candidate rev-parse HEAD)" = "$EXPECTED_REVISION"
          out="$RUNNER_TEMP/sutra-historical-source-regression"
          mkdir -p "$out"
          if (cd historical-pr49 && node --test --test-reporter=spec packages/sutra-runtime/test/source-tools.test.mjs) > "$out/historical-source.log" 2>&1; then echo 'Expected historical failure was not reproduced'; exit 1; fi
          grep -F '1 !== 2' "$out/historical-source.log"
          if (cd historical-pr49 && node --test --test-reporter=spec tools/sutra-evaluation/baseline.test.mjs) > "$out/historical-baseline.log" 2>&1; then echo 'Expected historical baseline failure was not reproduced'; exit 1; fi
          grep -F '50 !== 90' "$out/historical-baseline.log"
          cmp historical-pr49/packages/sutra-runtime/test/source-tools.test.mjs candidate/packages/sutra-runtime/test/source-tools.test.mjs
          cmp historical-pr49/tools/sutra-evaluation/baseline.test.mjs candidate/tools/sutra-evaluation/baseline.test.mjs
          (cd candidate && node --test --test-reporter=spec packages/sutra-runtime/test/source-tools.test.mjs tools/sutra-evaluation/baseline.test.mjs) | tee "$out/candidate.log"
          printf '%s\n' "$EXPECTED_REVISION" > "$out/candidate-revision.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sutra-historical-source-regression
          path: ${{ runner.temp }}/sutra-historical-source-regression/
          if-no-files-found: error
          retention-days: 30
