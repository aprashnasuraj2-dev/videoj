name: Validate SUTRA engineering evaluation
on:
  pull_request:
    paths:
      - 'apps/sutra/src/comparison.js'
      - 'apps/sutra/src/uncertainty-guidance.js'
      - 'apps/sutra/src/direct-lookup.js'
      - 'apps/sutra/src/receipt-actions.js'
      - 'apps/sutra/src/fixtures/**'
      - 'apps/sutra/public/content/**'
      - 'apps/sutra/public/agents/source_learner.network.json'
      - 'packages/sutra-runtime/**'
      - 'packages/sutra-evidence/**'
      - 'packages/sutra-source-tools/**'
      - 'packages/sutra-content-profile/**'
      - 'services/sutra-api/**'
      - 'tools/sutra-evaluation/**'
      - 'docs/sutra/evaluation/**'
      - 'docs/sutra/verification-map.json'
      - 'docs/sutra/evidence/metrics.json'
      - 'docs/sutra/tools/impact.mjs'
      - '.github/workflows/sutra-evaluation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run_evaluation: ${{ steps.gate.outputs.run_evaluation }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: gate
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          node docs/sutra/tools/impact.mjs --metrics "$TARGET_SHA" > "$RUNNER_TEMP/metrics.json"
          node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/metrics.json'));const m=d.metrics.find(x=>x.id==='engineering_baseline');const force=process.env.FORCE_RUN==='true';fs.appendFileSync(process.env.GITHUB_OUTPUT,'run_evaluation='+(force||!m||m.status==='stale')+'\n');"
          cat "$RUNNER_TEMP/metrics.json"
  baseline:
    needs: freshness
    if: ${{ github.event_name == 'workflow_dispatch' || needs.freshness.outputs.run_evaluation == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/sutra-evaluation/*.test.mjs
      - run: node tools/sutra-evaluation/baseline.mjs > "${RUNNER_TEMP}/sutra-engineering-evaluation.json"
      - uses: actions/upload-artifact@v4
        with:
          name: sutra-engineering-evaluation
          path: ${{ runner.temp }}/sutra-engineering-evaluation.json
