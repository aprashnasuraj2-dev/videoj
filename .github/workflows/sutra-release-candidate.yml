name: Validate SUTRA release-candidate artifact gate
on:
  pull_request:
    paths:
      - 'tools/sutra-release-candidate/**'
      - '.github/workflows/sutra-release-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/sutra-release-candidate/*.test.mjs
