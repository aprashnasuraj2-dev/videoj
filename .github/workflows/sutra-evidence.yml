name: Validate SUTRA evidence library
on:
  push:
    branches: [main]
    paths: ['packages/sutra-evidence/**', '.github/workflows/sutra-evidence.yml']
  pull_request:
    branches: [main]
    paths: ['packages/sutra-evidence/**', '.github/workflows/sutra-evidence.yml']
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact candidate revision
        env:
          EXPECTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test packages/sutra-evidence/test/*.test.mjs
