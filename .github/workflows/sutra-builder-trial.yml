name: Validate SUTRA outside-builder trial gate
on:
  pull_request:
    paths:
      - 'tools/sutra-builder-trial/**'
      - '.github/workflows/sutra-builder-trial.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  builder:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/sutra-builder-trial/*.test.mjs
