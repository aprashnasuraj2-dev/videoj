name: Validate SUTRA reviewed content pack compiler
on:
  pull_request:
    paths:
      - 'tools/sutra-content-pack/**'
      - 'tools/sutra-content-intake/**'
      - 'packages/sutra-content-profile/**'
      - '.github/workflows/sutra-content-pack.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/sutra-content-pack/*.test.mjs
