name: Validate DETOUR

on:
  push:
    branches: [detour, main]
    paths:
      - 'detour/**'
      - '.github/workflows/detour-ci.yml'
  pull_request:
    branches: [main, detour]
    paths:
      - 'detour/**'
      - '.github/workflows/detour-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  phase-5:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    defaults:
      run:
        working-directory: detour
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: detour/package-lock.json
      - name: Install media tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install pinned dependencies
        run: npm ci
      - name: Install DETOUR browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Build production demo
        run: npm run build
      - name: Verify showcase bundle and local HTTP seeking
        run: node --test tests/showcase.test.mjs
      - name: Verify frozen public HTTPS release origin
        run: node --test tests/https-release.test.mjs
      - name: Verify public release and standard controls
        run: node --test tests/phase10-public.test.mjs
      - name: Verify independently embedded player
        run: node --test tests/live-site.test.mjs
      - name: Audit final bundle, package license and secret boundary
        run: node scripts/final-audit.mjs
      - name: Verify static package boundaries
        run: npm run test:architecture
      - name: Verify packed external host in Chromium and desktop WebKit
        run: npm run test:package
      - name: Run full Chromium regression
        run: npm test
      - name: Run full Firefox regression
        env:
          DETOUR_ENGINE: firefox
        run: npm test
      - name: Run full desktop WebKit regression
        env:
          DETOUR_ENGINE: webkit
        run: npm test
      - name: Measure incremental compressed package footprint
        if: always()
        run: node --test tests/footprint.test.mjs
      - name: Chromium responsive, keyboard, preferences and emulated touch probes
        if: always()
        env:
          DETOUR_PHASE7_CAPTURES: phase7-captures
        run: node --test tests/phase7.test.mjs
      - name: Preserve browser captures on passing or failing probes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detour-phase7-browser-probes
          path: detour/phase7-captures/
          if-no-files-found: ignore
          retention-days: 7
      - name: Pack reusable DETOUR skin
        if: success()
        run: |
          rm -rf release-package
          mkdir -p release-package
          npm pack --pack-destination release-package
      - name: Preserve reusable DETOUR package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: detour-reusable-package-${{ github.sha }}
          path: detour/release-package/*.tgz
          if-no-files-found: error
          retention-days: 14
      - name: Preserve exact production release bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: detour-production-dist-${{ github.sha }}
          path: detour/dist/
          if-no-files-found: error
          retention-days: 14
      - name: Stage exact successful dist on immutable DETOUR branch
        if: success() && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[stage-dist]'))
        env:
          DETOUR_BUILD_RUN_ID: ${{ github.run_id }}
        run: node scripts/stage-release-dist.mjs
