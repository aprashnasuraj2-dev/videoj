name: Validate DETOUR

on:
  push:
    branches: [main, detour]
    paths:
      - 'detour/skin/**'
      - 'detour/demo/**'
      - 'detour/integration/**'
      - 'detour/mux/**'
      - 'detour/public/**'
      - 'detour/scripts/**'
      - 'detour/tests/**'
      - 'detour/package.json'
      - 'detour/package-lock.json'
      - 'detour/vite.config.js'
      - '.github/workflows/detour-ci.yml'
  pull_request:
    branches: [main, detour]
    paths:
      - 'detour/skin/**'
      - 'detour/demo/**'
      - 'detour/integration/**'
      - 'detour/mux/**'
      - 'detour/public/**'
      - 'detour/scripts/**'
      - 'detour/tests/**'
      - 'detour/package.json'
      - 'detour/package-lock.json'
      - 'detour/vite.config.js'
      - '.github/workflows/detour-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: detour
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: detour/package-lock.json
      - name: Install media tools and dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          npm ci
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Build demo
        run: npm run build
      - name: Verify package boundary and media provenance
        run: |
          npm run test:architecture
          node scripts/final-audit.mjs
      - name: Verify local showcase and external host
        run: |
          node --test tests/showcase.test.mjs
          npm run test:package
      - name: Verify Chromium, Firefox and WebKit
        run: |
          npm test
          DETOUR_ENGINE=firefox npm test
          DETOUR_ENGINE=webkit npm test
      - name: Verify responsive, keyboard and size constraints
        run: |
          node --test tests/responsive.test.mjs
          node --test tests/footprint.test.mjs
      - name: Verify optional published integrations on demand
        if: github.event_name == 'workflow_dispatch'
        run: |
          node --test tests/https-release.test.mjs
          node --test tests/public-release.test.mjs
          node --test tests/live-site.test.mjs
          node --test tests/mux.test.mjs
          node --test tests/mux-release.test.mjs
      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: detour-failure-diagnostics
          path: |
            detour/test-results/
            detour/phase7-captures/
            detour/phase9-diagnostics/
          retention-days: 3
          if-no-files-found: ignore
      - name: Package reusable source on demand
        if: github.event_name == 'workflow_dispatch' && success()
        run: npm pack
      - name: Retain package for integration
        if: github.event_name == 'workflow_dispatch' && success()
        uses: actions/upload-artifact@v4
        with:
          name: detour-package-${{ github.sha }}
          path: detour/*.tgz
          retention-days: 5
          if-no-files-found: error
