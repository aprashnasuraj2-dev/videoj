name: Validate SUTRA provider measurement gate
on:
  pull_request:
    paths:
      - 'tools/sutra-provider-measurement/**'
      - '.github/workflows/sutra-provider-measurement.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measurement:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/sutra-provider-measurement/*.test.mjs
