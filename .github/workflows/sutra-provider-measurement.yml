name: Validate SUTRA provider measurement gate
on:
  pull_request:
    paths:
      - 'tools/sutra-provider-measurement/**'
      - 'tools/sutra-local-measurement/**'
      - '.github/workflows/sutra-provider-measurement.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measurement:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact candidate revision
        env:
          EXPECTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/sutra-provider-measurement/*.test.mjs tools/sutra-local-measurement/*.test.mjs
