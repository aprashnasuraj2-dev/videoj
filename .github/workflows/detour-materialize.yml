name: Materialize DETOUR release assets

on:
  workflow_dispatch:
  push:
    branches: [detour]
    paths:
      - '.github/workflows/detour-materialize.yml'

permissions:
  contents: write

concurrency:
  group: detour-release-assets
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: detour
          fetch-depth: 0
      - name: Install media tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Generate deterministic release media
        working-directory: detour
        run: node scripts/make-fixture.mjs
      - name: Verify release files
        run: |
          set -euo pipefail
          ffprobe -v error -show_entries format=duration,size -of json detour/public/showcase/detour-showcase-v1.mp4
          sha256sum             detour/public/showcase/detour-showcase-v1.mp4             detour/public/showcase/detour-showcase-v1-poster.jpg             detour/public/showcase/detour-showcase-v1.vtt             detour/public/showcase/detour-showcase-v1.json             detour/public/fixtures/daylight-study.mp4             detour/public/fixtures/daylight-study.vtt
      - name: Commit immutable static-release media when changed
        run: |
          set -euo pipefail
          git add -f             detour/public/showcase/detour-showcase-v1.mp4             detour/public/showcase/detour-showcase-v1-poster.jpg             detour/public/showcase/detour-showcase-v1.vtt             detour/public/showcase/detour-showcase-v1.json             detour/public/fixtures/daylight-study.mp4             detour/public/fixtures/daylight-study.vtt
          if git diff --cached --quiet; then
            echo 'Release assets already match the generator.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'detour: materialize verified static release media'
          git push origin HEAD:detour
