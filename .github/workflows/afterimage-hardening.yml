name: AFTERIMAGE hardening gates

on:
  push:
    branches: [afterimage-hardening]
    paths:
      - 'afterimage/**'
      - '.github/workflows/afterimage-hardening.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: afterimage
    steps:
      - name: Checkout exact hardening head
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: afterimage/package-lock.json

      - name: Install media tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install locked dependencies
        run: npm ci

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Architecture and concept-boundary tests
        run: npm test

      - name: Rebuild standalone from canonical sources
        run: npm run build:standalone

      - name: Record standalone drift without promoting it
        run: |
          if git diff --quiet -- standalone.html; then
            echo "standalone_status=exact" >> "$GITHUB_ENV"
          else
            echo "standalone_status=regenerated-uncommitted" >> "$GITHUB_ENV"
            git diff --stat -- standalone.html
          fi

      - name: Production build
        run: npx vite build

      - name: Inspect pack surface
        run: npm pack --dry-run

      - name: Source lifecycle — Chromium
        env:
          AFTERIMAGE_HARDENING_ENGINE: chromium
        run: node --test tests/source-lifecycle.test.mjs

      - name: Source lifecycle — Firefox
        env:
          AFTERIMAGE_HARDENING_ENGINE: firefox
        run: node --test tests/source-lifecycle.test.mjs

      - name: Source lifecycle — WebKit
        env:
          AFTERIMAGE_HARDENING_ENGINE: webkit
        run: node --test tests/source-lifecycle.test.mjs

      - name: Packed external host
        run: node --test tests/package-external-host.test.mjs

      - name: Difficult media matrix
        run: node --test tests/difficult-media.test.mjs

      - name: Performance and footprint
        run: node --test tests/performance-footprint.test.mjs

      - name: Hardened standalone browser, keyboard, touch and fullscreen regression
        env:
          AFTERIMAGE_URL: http://127.0.0.1:4173/standalone.html
          AFTERIMAGE_RELEASE: ''
          AFTERIMAGE_VERSION: 0.3.10-control-fit
        run: |
          npx vite --host 127.0.0.1 --port 4173 > /tmp/afterimage-hardening-vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/standalone.html >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/afterimage-hardening-vite.log
            exit 1
          fi
          BROWSER=chromium node tests/public-candidate.playwright.mjs
          BROWSER=firefox node tests/public-candidate.playwright.mjs
          BROWSER=webkit node tests/public-candidate.playwright.mjs
          xvfb-run -a node tests/official-gates.playwright.mjs
          node tests/touch-robustness.playwright.mjs
          xvfb-run -a node tests/fullscreen.playwright.mjs
          node tests/judge-first-use.playwright.mjs

      - name: Reconcile generated standalone on hardening branch
        if: success() && github.actor != 'github-actions[bot]'
        run: |
          if ! git diff --quiet -- standalone.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add standalone.html
            git commit -m "build(afterimage): reconcile hardening standalone"
            git push origin HEAD:afterimage-hardening
          fi

      - name: Preserve hardening evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afterimage-hardening-evidence-${{ github.sha }}
          path: |
            afterimage/artifacts/
            afterimage/standalone.html
          if-no-files-found: warn
          retention-days: 30
