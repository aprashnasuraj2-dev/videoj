name: Validate SUTRA local inference gateway
on:
  pull_request:
    paths:
      - 'tools/sutra-local-gateway/**'
      - '.github/workflows/sutra-local-gateway.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tools/sutra-local-gateway/*.test.mjs
