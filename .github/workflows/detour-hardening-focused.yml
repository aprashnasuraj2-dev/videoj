name: DETOUR hardening focused gates

on:
  push:
    branches: [detour-hardening]
    paths:
      - 'detour/**'
      - '.github/workflows/detour-hardening-focused.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: detour
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: detour/package-lock.json
      - name: Install media tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install dependencies
        run: npm ci
      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Build
        run: npm run build
      - name: Keyboard journey — Chromium
        env:
          DETOUR_HARDENING_ENGINE: chromium
        run: node --test tests/keyboard-full-journey.test.mjs
      - name: Keyboard journey — Firefox
        env:
          DETOUR_HARDENING_ENGINE: firefox
        run: node --test tests/keyboard-full-journey.test.mjs
      - name: Keyboard journey — WebKit
        env:
          DETOUR_HARDENING_ENGINE: webkit
        run: node --test tests/keyboard-full-journey.test.mjs
      - name: Headed fullscreen roundtrip
        run: xvfb-run -a node --test tests/fullscreen-roundtrip.test.mjs
      - name: Touch interruption recovery
        run: node --test tests/touch-interruption.test.mjs
      - name: Judge-first-use
        run: node --test tests/judge-first-use.test.mjs
      - name: Preserve focused evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detour-focused-evidence-${{ github.sha }}
          path: detour/artifacts/hardening/
          if-no-files-found: warn
          retention-days: 30
