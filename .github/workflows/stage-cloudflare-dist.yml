name: Restage an existing verified Cloudflare build
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Main branch Validate submission candidate run with a successful verify job
        type: string
        required: true
permissions:
  actions: read
  contents: write
jobs:
  stage-dist:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Resolve successful verify job and source SHA
        id: run
        uses: actions/github-script@v7
        env:
          SOURCE_RUN_ID: ${{ inputs.run_id }}
        with:
          script: |
            const run_id = Number(process.env.SOURCE_RUN_ID);
            if (!Number.isSafeInteger(run_id) || run_id < 1) throw new Error('Invalid workflow run ID');
            const { owner, repo } = context.repo;
            const { data: run } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id });
            if (run.path !== '.github/workflows/ci.yml' || run.head_branch !== 'main' || run.event !== 'push') {
              throw new Error('Choose a main push from Validate submission candidate');
            }
            const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({ owner, repo, run_id, filter: 'latest' });
            if (!jobs.jobs.some(job => job.name === 'verify' && job.conclusion === 'success')) {
              throw new Error('The verify job must succeed before using its candidate-evidence artifact');
            }
            core.setOutput('source', run.head_sha);
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.run.outputs.source }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: candidate-evidence
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.run_id }}
      - name: Restage the same verified artifact
        env:
          DHAGO_BUILD_SHA: ${{ steps.run.outputs.source }}
          DHAGO_BUILD_RUN_ID: ${{ inputs.run_id }}
        run: node scripts/stage-cf-dist.mjs
