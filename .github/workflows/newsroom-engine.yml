name: newsroom-engine
on:
  push:
    branches: [newsroom-reel-engine]
    paths: ['newsroom/**', '.github/workflows/newsroom-engine.yml']
  pull_request:
    paths: ['newsroom/**', '.github/workflows/newsroom-engine.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-lato fonts-noto-core
          python -m pip install --upgrade pip
          python -m pip install -r newsroom/requirements.txt
      - name: Syntax, evidence & render smoke
        run: |
          python -m compileall -q newsroom
          python -m newsroom validate newsroom/templates/example_ai_bubble.json
          python -m newsroom validate newsroom/templates/example_ai_bubble_ne.json
          python -m pytest -q newsroom/tests