name: Validate SUTRA learner shell
on:
  push:
    branches: [main]
    paths: ['apps/sutra/**', 'apps/sutra-peer/**', 'packages/sutra-evidence/**', 'packages/sutra-runtime/**', 'packages/sutra-source-tools/**', 'packages/sutra-inference/**', 'packages/sutra-consent/**', 'packages/sutra-content-profile/**', 'packages/sutra-actions/**', 'services/sutra-api/**', 'src/**', '.github/workflows/sutra-shell.yml']
  pull_request:
    branches: [main]
    paths: ['apps/sutra/**', 'apps/sutra-peer/**', 'packages/sutra-evidence/**', 'packages/sutra-runtime/**', 'packages/sutra-source-tools/**', 'packages/sutra-inference/**', 'packages/sutra-consent/**', 'packages/sutra-content-profile/**', 'packages/sutra-actions/**', 'services/sutra-api/**', 'src/**', '.github/workflows/sutra-shell.yml']
permissions:
  contents: read
jobs:
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: apps/sutra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/sutra/package-lock.json
            apps/sutra-peer/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node --test ../../packages/sutra-actions/test/*.test.mjs ../../packages/sutra-inference/test/*.test.mjs ../../packages/sutra-source-tools/test/*.test.mjs ../../packages/sutra-consent/test/*.test.mjs ../../packages/sutra-content-profile/test/*.test.mjs ../../services/sutra-api/test/*.test.mjs
      - run: node ../../packages/sutra-runtime/verify-vendor.mjs
      - run: node --test ../../packages/sutra-runtime/test/*.test.mjs
      - name: Build and test independent SUTRA peer publication
        working-directory: apps/sutra-peer
        run: npm ci && npm run build && npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sutra-shell-debug
          path: apps/sutra/test-output/
          retention-days: 3
          if-no-files-found: ignore
