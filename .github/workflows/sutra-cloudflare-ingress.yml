name: Validate SUTRA Cloudflare ingress
on:
  pull_request:
    paths:
      - 'deploy/sutra-pages/**'
      - 'services/sutra-api/**'
      - '.github/workflows/sutra-cloudflare-ingress.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ingress:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test deploy/sutra-pages/ingress.test.mjs
