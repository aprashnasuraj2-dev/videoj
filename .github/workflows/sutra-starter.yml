name: Validate SUTRA publisher starter
on:
  pull_request:
    paths:
      - 'tools/sutra-starter/**'
      - 'packages/sutra-*/**'
      - '.github/workflows/sutra-starter.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate outside repository and verify standalone
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/sutra-publisher-starter"
          node tools/sutra-starter/create.mjs "$target"
          cd "$target"
          npm install --ignore-scripts --offline --no-audit --no-fund
          npm run verify:vendor
          npm test
          test -f LICENSE
          test -f packages/sutra-runtime/vendor/nsdeploy/UPSTREAM.json
          if find . -type l -print -quit | grep -q .; then exit 1; fi
      - name: Install browser harness only
        working-directory: apps/sutra
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Exercise generated starter page in Chromium
        run: node tools/sutra-starter/browser.cjs "$RUNNER_TEMP/sutra-publisher-starter"
