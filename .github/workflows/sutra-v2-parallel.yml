name: Validate SUTRA parallel workstream
on:
  pull_request:
    branches: ['sutra/v2-knowledge-compiler']
permissions:
  contents: read
jobs:
  workstream-js:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run knowledge and inference regression suites
        run: node --test packages/sutra-knowledge/test/*.test.mjs packages/sutra-inference/test/*.test.mjs
      - name: Check workstream JavaScript syntax
        run: |
          node --check apps/sutra-v2/src/reviewed-workspace.js
          node --check apps/sutra-v2/test/browser.cjs
      - name: Explicit verification boundary
        run: echo 'Scoped JS candidate only. Full integration, formal, independent replay and browser gates are mandatory on the integration branch.'
