name: Validate SUTRA user-study scoring gate
on:
  pull_request:
    paths:
      - 'tools/sutra-user-study/**'
      - '.github/workflows/sutra-user-study.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/sutra-user-study/*.test.mjs
