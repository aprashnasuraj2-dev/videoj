name: Validate SUTRA physical-device evidence gate
on:
  pull_request:
    paths:
      - 'tools/sutra-device-check/**'
      - '.github/workflows/sutra-device-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/sutra/package-lock.json
      - run: node --test tools/sutra-device-check/*.test.mjs
      - name: Build device-ready static candidate
        working-directory: apps/sutra
        run: npm ci && npm run build
      - name: Preflight device-ready candidate
        run: node tools/sutra-device-check/preflight.mjs apps/sutra/dist > "$RUNNER_TEMP/device-bundle-preflight.json" && cat "$RUNNER_TEMP/device-bundle-preflight.json"
      - uses: actions/upload-artifact@v4
        with:
          name: sutra-device-ready-static-bundle
          path: apps/sutra/dist
          retention-days: 7
          if-no-files-found: error
