name: Validate SUTRA physical-device evidence gate
on:
  pull_request:
    paths:
      - 'tools/sutra-device-check/**'
      - '.github/workflows/sutra-device-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tools/sutra-device-check/*.test.mjs
